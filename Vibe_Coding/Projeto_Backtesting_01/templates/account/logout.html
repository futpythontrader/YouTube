{% extends "base.html" %}

{% block title %}Sair — BacktestBet{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Sair</h1>
        <p class="text-sm text-gray-500 mb-8">
            Tem certeza que deseja sair da sua conta?
        </p>

        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}

            {% if redirect_field_value %}
                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
            {% endif %}

            <div class="flex flex-col gap-3">
                <button type="submit"
                        class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold
                               py-2.5 rounded-lg text-sm transition-colors focus:outline-none
                               focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                    Sim, sair
                </button>
                <a href="{% url 'backtest:dashboard' %}"
                   class="w-full border border-gray-300 text-gray-700 hover:bg-gray-50
                          font-semibold py-2.5 rounded-lg text-sm text-center transition-colors">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
